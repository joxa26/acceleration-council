name: AI Invoice Capturer — Lead Research

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new leads to find this run"
        required: false
        default: "15"
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC

jobs:
  research-leads:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: growth/ai-invoice-capturer-leadgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Research leads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.cli --limit "${{ github.event.inputs.limit || '15' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-invoice-capturer-leads-${{ github.run_id }}
          path: growth/ai-invoice-capturer-leadgen/output/leads.csv
          retention-days: 90
